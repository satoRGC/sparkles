services:
  db:
    image: postgres
    restart: unless-stopped
    ports:
      - 5432:5432
    environment: 
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql
  sparkles:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
volumes:
  pgdata:
